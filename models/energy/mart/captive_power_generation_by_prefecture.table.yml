schema: energy
name: captive_power_generation_by_prefecture
title: 自家用発電所等実績（都道府県別・原動力別・2024年度〜・月次）
description: |-
  電力調査統計の、自家用発電の都道府県別・原動力別・月次の最大出力と発電電力量（2024年度〜）です。

  - 合計と内訳と再掲が同じ列に並びます。`is_reference` が true の行と `power_source_name` が「計」の行を混ぜて合計すると二重に数えます。
  - 新エネルギーの計はバイオマスの再掲を含み、captive_power_generation_by_area と区分の定義が違います。
  - 蓄電池の発電電力量の欄は充電電力量です。
keywords:
  - 経済産業省
  - 資源エネルギー庁
  - 電力調査統計
  - 自家用発電
  - 発電電力量
  - 自家消費
  - 卸電力取引所
  - コージェネレーション
  - 都道府県
  - エネルギー
published: true
themes: [energy_water]
sources:
  - path: https://www.enecho.meti.go.jp/statistics/electric_power/ep002/
fields:
  - name: fiscal_year
    title: 年度（4月始まり）
  - name: year
    title: 年（暦年）
  - name: month
    title: 月
  - name: year_month
    title: 年月（YYYYMM）
  - name: pref_code
    title: 都道府県コード（全国地方公共団体コードの上2桁）
    semantic: { role: entity, name: prefecture }
  - name: pref_name
    title: 都道府県名
  - name: power_source_group
    title: 原動力の大分類（水力・火力・火力（燃料別）・原子力・新エネルギー・燃料電池等・蓄電池・合計）
  - name: power_source_name
    title: 原動力の小分類。大分類が小分類を持たないときは大分類と同じ値
  - name: is_reference
    title: 再掲の行か（火力のコージェネレーションと燃料別、新エネルギーのバイオマス）
  - name: capacity_kw
    title: 最大出力（kW。当該月の値）
  - name: generation_mwh
    title: 発電電力量（MWh）
  - name: station_use_and_loss_mwh
    title: 所内及び損失電力量（MWh）
  - name: transmission_to_utilities_mwh
    title: 電気事業者への送電電力量（MWh）
  - name: transmission_to_specified_supply_mwh
    title: 特定供給の相手方への送電電力量（MWh）
  - name: transmission_to_other_operators_mwh
    title: その他事業者への送電電力量（MWh）
  - name: transmission_total_mwh
    title: 電気事業者等への送電電力量の合計（MWh）
  - name: transmission_via_exchange_mwh
    title: 送電電力量の合計のうち卸電力取引所を通じた取引（MWh。合計の内数）
  - name: self_consumption_mwh
    title: 自家消費電力量（MWh）
