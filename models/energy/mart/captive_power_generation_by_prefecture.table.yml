schema: energy
name: captive_power_generation_by_prefecture
title: 自家用発電所等実績（都道府県別・原動力別・2024年度〜・月次）
description: |-
  資源エネルギー庁 電力調査統計の統計表 5「自家用発電所等実績」。
  自家用発電所（自らの需要のために発電する設備）の最大出力と発電した電力量、その行き先を
  都道府県×月×原動力の1レコードで収録する。電力量の単位は MWh（原典の kWh を1,000で割った値）、
  最大出力は kW。
  発電した電力量（generation_mwh）は、所内及び損失電力量・電気事業者等への送電電力量・
  自家消費電力量に分かれる。送電電力量は送電先（電気事業者／特定供給の相手方／その他事業者）の
  内訳を持ち、transmission_via_exchange_mwh はそのうち卸電力取引所を通じた取引の再掲。
  原動力は power_source_group（水力・火力・火力（燃料別）・原子力・新エネルギー・
  燃料電池等・蓄電池・合計）と power_source_name の2列で持つ。合計と内訳と再掲が同じ列に
  並ぶので、is_reference が true の行と power_source_name が「計」の行を混ぜて足すと
  二重計上になる。
  2023年度以前を10地域で収録した captive_power_generation_by_area の後継で、原典が2024年度から
  統計表 5-(1)「自家用発電所数、出力」と 5-(2)「自家用発電実績」を1つのファイルへ統合し、
  同時に内訳が経済産業局の10地域から47都道府県へ細かくなった。区分の作りも変わっており、
  あちらの新エネルギー等の計はバイオマスと廃棄物の再掲を含まないが、こちらの新エネルギーの計は
  バイオマスの再掲を含む（そのぶん合計からは差し引かれている）。系列として繋ぐときは
  区分の定義を確かめること。
  発電所数は原典が年度計の欄にしか持たないため収録していない（月次の欄は最大出力と電力量だけ）。
  power_generation_by_prefecture は電気事業者の発電実績で、対象が重ならないので足し合わせても
  都道府県の発電量の全量にはならない。
  収録は2024年4月から2026年3月までの24か月・47都道府県・25の原動力区分で28,200行。
  原典のブロックのうち全国合計は持たない（47都道府県の和と一致することを確認済み）。
  蓄電池の発電電力量の欄は充電電力量（原典の注6）で、発電した電力量ではない。
  原典の側の食い違いをそのまま収録している。2024年度の岡山県は火力の燃料別の計が
  原動力別の計より小さい（年度計の発電電力量で467,530MWh）。2024年度の茨城県は太陽光の
  発電電力量が所内損失・送電・自家消費の和より小さい（年度計で15.6MWh）。
  出典: 経済産業省 資源エネルギー庁 電力調査統計。
  https://www.enecho.meti.go.jp/statistics/electric_power/ep002/
