schema: energy
name: power_plants_by_prefecture
title: 都道府県別発電所数・最大出力（2019年度〜・月次）
description: '資源エネルギー庁 電力調査統計の統計表 1-(2)「都道府県別発電所数、出力」（2019年度〜）。

  電気事業者の発電所の数と最大出力（設備容量）を都道府県×月の1レコードで収録する。

  発電所の種別は水力・火力・原子力・新エネルギー等・その他で、新エネルギー等は

  風力・太陽光・地熱・蓄電池の内訳を持つ。最大出力の単位は kW。

  同じ都道府県×月の発電実績（power_generation_by_prefecture）と突き合わせると

  設備あたりの発電量を出せる。バイオマスと廃棄物は主燃料で見た火力発電所からの再掲で、

  火力と合計には含まれ、新エネルギー等の計には含まれない（原典の備考）。

  収録するのは47都道府県で、原典の合計行（全国計）は持たない。

  出典: 経済産業省 資源エネルギー庁 電力調査統計。

  https://www.enecho.meti.go.jp/statistics/electric_power/ep002/'
