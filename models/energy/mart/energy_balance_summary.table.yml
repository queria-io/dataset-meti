schema: energy
name: energy_balance_summary
title: 総合エネルギー統計 時系列表（1990年度〜）
description: |-
  総合エネルギー統計の時系列表（1990年度〜）の、一次エネルギー供給・最終消費・電源構成・CO2排出量・自給率です。

  - `value_type` が ratio の行は比率（0.25 = 25%）で、実数と合計できません。
  - 合計・内訳・再掲が同じ `item_name` 列に並ぶため、絞らずに合計すると二重に数えます。
keywords:
  - 経済産業省
  - 資源エネルギー庁
  - 総合エネルギー統計
  - エネルギー
  - CO2排出量
  - 電源構成
annotations: { queria: { themes: [energy_water] } }
sources:
  - path: https://www.enecho.meti.go.jp/statistics/total_energy/
fields:
  - name: table_no
    title: 統計表番号（1〜7）
  - name: table_name
    title: 統計表名
  - name: item_name
    title: 項目名（エネルギー源・部門・電源等）
  - name: item_level
    title: 項目の階層（0=大項目、1=内訳）
  - name: series
    title: 系列ラベル（PJ／原油換算万kl／億kWh／Mt-CO2／kg-CO2/kWh／構成比／前年度比／％）
  - name: value_type
    title: 値の種類（quantity=実数、ratio=比率で小数）
  - name: fiscal_year
    title: 年度
  - name: value
    title: 値（series の単位。ratio は小数で 0.25＝25%）
  - name: source_edition
    title: 取り込んだ時系列表の版（例 2024年度確報）
