schema: energy
name: power_plants_by_operator
title: 電気事業者別発電所数・最大出力（2019年度〜・月次）
description: |-
  資源エネルギー庁 電力調査統計の統計表 1-(1)「電気事業者の発電所数、出力」（2019年度〜）。
  電気事業者ごとの発電所の数と最大出力（設備容量）を事業者×月の1レコードで収録する。
  発電所の種別は水力・火力・原子力・新エネルギー等・その他で、水力は一般と揚水式、
  火力は石炭・ＬＮＧ・石油・ＬＰＧ・その他ガス・歴青質混合物・その他の燃料別、
  新エネルギー等は風力・太陽光・地熱・蓄電池の内訳を持つ。最大出力の単位は kW。
  同じ事業者×月の発電実績（power_generation_by_operator）と突き合わせると
  設備あたりの発電量を出せる。バイオマスと廃棄物は主燃料で見た火力発電所からの再掲で、
  火力の計と合計には含まれ、新エネルギー等の計には含まれない（原典の備考3）。
  発電所数と最大出力は数え方が違い、種別ごとの発電所数を足しても発電所の実数にはならない。is_ で始まる列は当該月にその事業区分に該当したかを表す。
  事業者名は原典の表記のままで名寄せしておらず、同じ月に同じ名前が2行並ぶことがある。
  収録するのは事業者の行で、原典の合計行（全事業者計）は持たない。
  出典: 経済産業省 資源エネルギー庁 電力調査統計。
  https://www.enecho.meti.go.jp/statistics/electric_power/ep002/
