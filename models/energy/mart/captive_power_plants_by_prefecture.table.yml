schema: energy
name: captive_power_plants_by_prefecture
title: 自家用発電所数（都道府県別・原動力別・2024年度〜・年度）
description: |-
  資源エネルギー庁 電力調査統計の統計表 5「自家用発電所等実績」のうち、発電所数。
  自家用発電所（自らの需要のために発電する設備）の数を都道府県×年度×原動力の1レコードで
  収録する。原典が発電所数を年度計の欄にしか持たないため、粒度は月次ではなく年度。
  同じ表の最大出力と発電電力量は captive_power_generation_by_prefecture が月次で持つ。
  2023年度末（2024年3月末）で切れている captive_power_plants_by_area の続きにあたる系列で、
  原典が2024年度から統計表 5-(1)「自家用発電所数、出力」を統計表 5 に統合し、同時に内訳が
  経済産業局の10地域から47都道府県へ細かくなった。区分の作りは変わっており、あちらの
  新エネルギー等の計はバイオマスの再掲を含まないが、こちらの新エネルギーの計は含む。
  そのため合計は 水力＋火力の計＋原子力＋新エネルギーの計＋燃料電池等＋蓄電池 から
  バイオマスの再掲を差し引いた値になる（全都道府県・全年度で成立することを確認済み）。
  原動力は power_source_group（水力・火力・火力（燃料別）・原子力・新エネルギー・
  燃料電池等・蓄電池・合計）と power_source_name の2列で持つ。合計と内訳と再掲が同じ列に
  並ぶので、is_reference が true の行と power_source_name が「計」の行を混ぜて足すと
  二重計上になる。
  報告の対象は発電設備の合計出力が1,000kW以上の自家用発電所。複数の発電方式を持つ発電所は
  方式ごとに1つの発電所として数えるため、電気事業者の表（power_plants_by_prefecture /
  power_plants_by_operator）と数え方が違ううえ、対象そのものが重ならない。
  足し合わせても都道府県の発電設備の全量にはならない。
  原典は年度計の欄の最大出力についてのみ期末（3月）の値と注記しており（注7）、発電所数が
  どの時点の数かは書いていない。
  収録は2024年度と2025年度・47都道府県・25の原動力区分で2,350行。
  原典のブロックのうち全国合計は持たない（47都道府県の和と一致することを確認済み）。
  原典の側の食い違いをそのまま収録している。2024年度の岡山県は火力（燃料別）の計が52ではなく
  51で、原動力別の計と1か所ずれる（発電電力量でも同じ県・同じ年度がずれる）。
  出典: 経済産業省 資源エネルギー庁 電力調査統計。
  https://www.enecho.meti.go.jp/statistics/electric_power/ep002/
