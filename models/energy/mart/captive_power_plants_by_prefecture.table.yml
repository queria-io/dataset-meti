  - name: pref_code
    title: 都道府県コード（全国地方公共団体コードの上2桁）
  - name: pref_name
    title: 都道府県名
  - name: power_source_group
    title: 原動力の大分類（水力・火力・火力（燃料別）・原子力・新エネルギー・燃料電池等・蓄電池・合計）
