schema: energy
name: captive_power_plants_by_prefecture
title: 自家用発電所数（都道府県別・原動力別・2024年度〜・年度）
description: |-
  電力調査統計の、自家用発電所の都道府県別・原動力別・年度の発電所数（2024年度〜）です。

  - 合計と内訳と再掲が同じ列に並びます。`is_reference` が true の行と `power_source_name` が「計」の行を混ぜて合計すると二重に数えます。
  - 新エネルギーの計はバイオマスの再掲を含み、captive_power_plants_by_area と区分の定義が違います。
keywords:
  - 経済産業省
  - 資源エネルギー庁
  - 電力調査統計
  - 自家用発電
  - 発電所
  - コージェネレーション
  - 太陽光発電
  - 都道府県
  - エネルギー
published: true
themes: [energy_water]
sources:
  - path: https://www.enecho.meti.go.jp/statistics/electric_power/ep002/
fields:
  - name: fiscal_year
    title: 年度（4月始まり）
  - name: pref_code
    title: 都道府県コード（全国地方公共団体コードの上2桁）
    semantic: { role: entity, name: prefecture }
  - name: pref_name
    title: 都道府県名
  - name: power_source_group
    title: 原動力の大分類（水力・火力・火力（燃料別）・原子力・新エネルギー・燃料電池等・蓄電池・合計）
  - name: power_source_name
    title: 原動力の小分類。大分類が小分類を持たないときは大分類と同じ値
  - name: is_reference
    title: 再掲の行か（火力のコージェネレーションと燃料別、新エネルギーのバイオマス）
  - name: plant_count
    title: 自家用発電所数
