schema: energy
name: power_thermal_fuel_by_type
title: 火力発電燃料実績（2016年度〜・月次）
description: '資源エネルギー庁 電力調査統計の統計表 4「火力発電燃料実績」（2016年度〜）。

  電気事業者の火力発電所が受け入れ・消費した燃料を燃料種×月の1レコードで収録する。

  燃料種は石炭・重油・原油・LNG・都市ガス・高炉ガス・バイオマス・廃棄物などで、

  2023年度以前は24種、2024年度以降は28種（木質／その他バイオマスの分割、アンモニア・水素の追加）。

  受入量・消費量・単位量あたりの発熱量・月末貯蔵量を持つ。

  数量の単位は燃料種ごとに違い（t・kl・10^3m3）、quantity_unit に入っている。

  全国の値のみで、都道府県別・発電所別の内訳は無い。

  出典: 経済産業省 資源エネルギー庁 電力調査統計。

  https://www.enecho.meti.go.jp/statistics/electric_power/ep002/'
keywords:
