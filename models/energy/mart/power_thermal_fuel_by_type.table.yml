schema: energy
name: power_thermal_fuel_by_type
title: 火力発電燃料実績（2016年度〜・月次）
description: |-
  電力調査統計の、電気事業者の火力発電所の燃料種別・月次の受入量・消費量・発熱量・月末貯蔵量です。

  - 数量の単位は燃料種ごとに違い、`quantity_unit` に入っています。
  - 全国の値だけです。燃料種は2024年度から28種に増えています。
keywords:
  - 経済産業省
  - 資源エネルギー庁
  - 電力調査統計
  - 火力発電
  - 燃料
  - LNG
  - 石炭
  - エネルギー
annotations: { queria: { themes: [energy_water] } }
sources:
  - path: https://www.enecho.meti.go.jp/statistics/electric_power/ep002/
fields:
  - name: fiscal_year
    title: 年度（4月始まり）
  - name: year
    title: 年（暦年）
  - name: month
    title: 月
  - name: year_month
    title: 年月（YYYYMM）
  - name: fuel_name
    title: 燃料種
  - name: quantity_unit
    title: 受入量・消費量・月末貯蔵量の単位（t / kl / 10^3m3）
  - name: heat_value_unit
    title: 発熱量の単位（kJ/kg / kJ/l / kJ/m3）
  - name: receipt_quantity
    title: 受入量（単位は quantity_unit）
  - name: consumption_quantity
    title: 発電用の消費量（単位は quantity_unit。雑用は含まない）
  - name: consumption_dry_quantity
    title: 乾ベースの消費量（石炭・バイオマスのみ。他の燃料種は NULL）
  - name: heat_value
    title: 単位量あたりの発熱量（単位は heat_value_unit）
  - name: month_end_stock_quantity
    title: 月末貯蔵量（単位は quantity_unit。振替・棚卸しによる出入りを調整した後の値）
  - name: published_as_of
    title: 当該月の値の公表時点（2016年度と2017年度の前半は原典に記載が無く NULL）
