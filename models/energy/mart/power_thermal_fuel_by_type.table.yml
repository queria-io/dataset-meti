fields:
  - name: fiscal_year
    title: 年度（4月始まり）
  - name: year
    title: 年（暦年）
  - name: month
    title: 月
  - name: year_month
    title: 年月（YYYYMM）
  - name: fuel_name
    title: 燃料種
  - name: quantity_unit
    title: 受入量・消費量・月末貯蔵量の単位（t / kl / 10^3m3）
  - name: heat_value_unit
    title: 発熱量の単位（kJ/kg / kJ/l / kJ/m3）
  - name: receipt_quantity
    title: 受入量（単位は quantity_unit）
  - name: consumption_quantity
    title: 発電用の消費量（単位は quantity_unit。雑用は含まない）
  - name: consumption_dry_quantity
    title: 乾ベースの消費量（石炭・バイオマスのみ。他の燃料種は NULL）
  - name: heat_value
    title: 単位量あたりの発熱量（単位は heat_value_unit）
  - name: month_end_stock_quantity
    title: 月末貯蔵量（単位は quantity_unit。振替・棚卸しによる出入りを調整した後の値）
  - name: published_as_of
