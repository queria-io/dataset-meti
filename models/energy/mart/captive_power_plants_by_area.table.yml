schema: energy
name: captive_power_plants_by_area
title: 自家用発電所数・最大出力（地域別・2016〜2023年度・半期）
description: |-
  資源エネルギー庁 電力調査統計の統計表 5-(1)「自家用発電所数、出力」。
  自家用発電所（自らの需要のために発電する設備）の数と最大出力を地域×時点の1レコードで
  収録する。公表は月次ではなく9月末・3月末の年2回で、year_month はその月末時点を表す。
  原動力は水力・火力（汽力／ガスタービン／内燃力）・原子力・
  新エネルギー等（風力／太陽光／地熱／蓄電池）・その他（燃料電池等）。最大出力の単位は kW。
  同じ電力調査統計でも power_plants_by_prefecture と power_plants_by_operator は
  電気事業者の発電所を数えた別の表で、対象が重ならないので足し合わせても
  国内の発電設備の全量にはならない。
  報告の対象は発電設備の合計出力が1,000kW以上の自家用発電所（原典の注1）。
  複数の発電方式を持つ発電所は方式ごとに1つの発電所として数えるため（原典の注2）、
  種別の発電所数を足すと合計と一致する（電気事業者の表は数え方が違う）。
  thermal_cogeneration_* は火力の内数で、火力の計にも合計にも含まれる。
  収録するのは10地域で、原典の全国合計の行は持たない（10地域の和で再現できる）。
  地域より細かい内訳は原典に無く、都道府県別の表とは結合できない。
  収録は2016年度後半（2016年9月末）から2023年度末（2024年3月末）までの16時点。
  2024年度以降は原典が「自家用発電所等運転半期報集計結果」に統合され、この形式では
  配布されていない。
  出典: 経済産業省 資源エネルギー庁 電力調査統計。
  https://www.enecho.meti.go.jp/statistics/electric_power/ep002/
