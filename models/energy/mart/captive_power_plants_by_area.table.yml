schema: energy
name: captive_power_plants_by_area
title: 自家用発電所数・最大出力（地域別・2016〜2023年度・半期）
description: |-
  電力調査統計の、自家用発電所の10地域別の発電所数と最大出力（9月末・3月末、2016〜2023年度）です。

  - 電気事業者の発電所とは対象が重ならず、合計しても国内の全量になりません。
  - 2024年度以降は captive_power_plants_by_prefecture に続きます。全国合計の行はありません。
keywords:
  - 経済産業省
  - 資源エネルギー庁
  - 電力調査統計
  - 自家用発電
  - 発電所
  - 設備容量
  - コージェネレーション
  - 地域
  - エネルギー
annotations: { queria: { themes: [energy_water] } }
sources:
