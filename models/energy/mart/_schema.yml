  - name: power_demand_by_municipality
    description: |
      資源エネルギー庁 電力調査統計の統計表 6-(1)「市町村別需要電力量」（2022年度〜2024年度）。
      小売電気事業者が供給した需要電力量を市区町村×月の1レコードで収録する。
      契約区分は「特別高圧／高圧」と「低圧」の2つで、都道府県別の統計表と違い特別高圧と高圧は
      分かれていない。需要量の単位は MWh（原典の 1,000kWh と同値）。
      収録するのは1,747市区町村で、政令指定都市は市単位・東京都特別区は区単位。
      原典に全国計・都道府県計の行は無く、市区町村コードの列も無い。
      市区町村名は都道府県の中でも一意ではない（北海道に泊村が2つある）。
      北方領土の6村は行はあるが値は全て0。負の値の行が4行ある（原典どおり）。
      合計は四捨五入の影響で内訳の和と一致しない月がある（原典の備考）。
      出典: 経済産業省 資源エネルギー庁 電力調査統計。
      https://www.enecho.meti.go.jp/statistics/electric_power/ep002/
    access: public
    columns:
      - name: fiscal_year
      - name: year
      - name: month
      - name: year_month
      - name: pref_code
      - name: pref_name
      - name: municipality_name
      - name: extra_high_and_high_demand_mwh
      - name: low_demand_mwh
      - name: total_demand_mwh
      - name: published_as_of

  - name: reverse_power_flow_by_municipality
    description: |
      資源エネルギー庁 電力調査統計の統計表 6-(2)「市町村別逆潮流量」（2022年度〜2024年度）。
      発電設備から系統へ流れた電力量（逆潮流量）を電源種別ごとに市区町村×月の1レコードで
      収録する。電源は水力・火力・原子力・風力・地熱・太陽光・バイオマス・蓄電池・その他で、
      蓄電池は2023年度に足された列のため2022年度は NULL。単位は MWh（原典の 1,000kWh と同値）。
      収録するのは1,747市区町村で、政令指定都市は市単位・東京都特別区は区単位。
      原典に全国計・都道府県計の行は無く、市区町村コードの列も無い。
      市区町村名は都道府県の中でも一意ではない（北海道に泊村が2つある）。
      北方領土の6村は行はあるが値は全て0。
      0 ではないが単位（1,000kWh）に満たない値は原典で「α」と記され、ここでは NULL になる
      （8,768セル。うち251は合計セルなので total_mwh も NULL）。
      合計は四捨五入の影響で電源別の和と一致しない月がある（原典の備考）。
      出典: 経済産業省 資源エネルギー庁 電力調査統計。
      https://www.enecho.meti.go.jp/statistics/electric_power/ep002/
    access: public
    columns:
      - name: fiscal_year
      - name: year
      - name: month
      - name: year_month
      - name: pref_code
      - name: pref_name
      - name: municipality_name
      - name: hydro_mwh
      - name: thermal_mwh
      - name: nuclear_mwh
      - name: wind_mwh
      - name: geothermal_mwh
      - name: solar_mwh
      - name: biomass_mwh
      - name: storage_battery_mwh
      - name: other_mwh
      - name: total_mwh
      - name: published_as_of

  - name: power_thermal_fuel_by_type
    description: |
      資源エネルギー庁 電力調査統計の統計表 4「火力発電燃料実績」（2016年度〜）。
      電気事業者の火力発電所が受け入れ・消費した燃料を燃料種×月の1レコードで収録する。
      燃料種は石炭・重油・原油・LNG・都市ガス・高炉ガス・バイオマス・廃棄物などで、2023年度以前は
      24種、2024年度以降は28種です（木質／その他バイオマスの分割、アンモニア・水素の追加）。
      受入量・消費量・単位量あたりの発熱量・月末貯蔵量を持つ。
      数量の単位は燃料種ごとに違い（t・kl・10^3m3）、quantity_unit に入っている。
      石炭とバイオマスだけ消費量が湿・乾の2段で公表され、乾ベースは
      consumption_dry_quantity に入る。全国の値のみで都道府県別・発電所別の内訳は無い。
      出典: 経済産業省 資源エネルギー庁 電力調査統計。
      https://www.enecho.meti.go.jp/statistics/electric_power/ep002/
    access: public
    columns:
      - name: fiscal_year
      - name: year
      - name: month
      - name: year_month
      - name: fuel_name
      - name: quantity_unit
      - name: heat_value_unit
      - name: receipt_quantity
      - name: consumption_quantity
      - name: consumption_dry_quantity
      - name: heat_value
      - name: month_end_stock_quantity
      - name: published_as_of
