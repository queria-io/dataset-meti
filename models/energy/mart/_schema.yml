version: 2

models:
  - name: energy_balance_summary
    description: |
      資源エネルギー庁 総合エネルギー統計の時系列表（1990年度〜）。一次エネルギー国内供給・
      最終消費（エネルギー源別／部門別）・電源構成（発電量／投入量）・CO2排出量・
      エネルギー自給率の7表を、統計表×項目×系列×年度の1レコードに展開して収録する。
      series は公表どおりの系列ラベル（PJ・原油換算万kl・億kWh・Mt-CO2・kg-CO2/kWh の
      単位系列、および構成比・前年度比・％）で、value_type が quantity（実数）か
      ratio（比率）かを示す。比率は小数（0.25 = 25%）で、実数とは合算できない。
      合計・内訳・再掲が同じ item_name 列に並ぶため、大項目を単純に合計すると二重計上になる。
      出典: 経済産業省 資源エネルギー庁 総合エネルギー統計。
      https://www.enecho.meti.go.jp/statistics/total_energy/
    access: public
    config:
      meta:
        title: "総合エネルギー統計 時系列表（1990年度〜）"
        published: true
        source_url: "https://www.enecho.meti.go.jp/statistics/total_energy/"
        tags: ["経済産業省", "資源エネルギー庁", "総合エネルギー統計", "エネルギー", "CO2排出量", "電源構成"]
    columns:
      - name: table_no
        meta:
          title: 統計表番号（1〜7）
      - name: table_name
        meta:
          title: 統計表名
      - name: item_name
        meta:
          title: 項目名（エネルギー源・部門・電源等）
      - name: item_level
        meta:
          title: 項目の階層（0=大項目、1=内訳）
      - name: series
        meta:
          title: 系列ラベル（PJ／原油換算万kl／億kWh／Mt-CO2／kg-CO2/kWh／構成比／前年度比／％）
      - name: value_type
        meta:
          title: 値の種類（quantity=実数、ratio=比率で小数）
      - name: fiscal_year
        meta:
          title: 年度
      - name: value
        meta:
          title: 値（series の単位。ratio は小数で 0.25＝25%）
      - name: source_edition
        meta:
          title: 取り込んだ時系列表の版（例 2024年度確報）

  - name: power_demand_by_prefecture
    description: |
      資源エネルギー庁 電力調査統計の統計表 3-(2)「都道府県別電力需要実績」（2016年度〜）。
      小売電気事業者が供給した電力需要量を都道府県×月の1レコードで収録する。
      契約区分は特別高圧・高圧・低圧・全電圧計の4つで、低圧だけ特定需要（経過措置料金）と
      自由料金の内訳を持つ。需要量の単位は MWh（原典の 1,000kWh と同値）。
      小売電気事業者数は当該月に需要実績のあった事業者の数で、区分をまたいで足せない
      （全電圧計は重複を除いた数のため各区分の和より小さい）。
      収録するのは47都道府県で、原典の合計行（全国計）は持たない。
      出典: 経済産業省 資源エネルギー庁 電力調査統計。
      https://www.enecho.meti.go.jp/statistics/electric_power/ep002/
    access: public
    config:
      meta:
        title: "都道府県別電力需要実績（2016年度〜・月次）"
        published: true
        source_url: "https://www.enecho.meti.go.jp/statistics/electric_power/ep002/"
        tags: ["経済産業省", "資源エネルギー庁", "電力調査統計", "電力需要", "都道府県", "エネルギー"]
    columns:
      - name: fiscal_year
        meta:
          title: 年度（4月始まり）
      - name: year
        meta:
          title: 年（暦年）
      - name: month
        meta:
          title: 月
      - name: year_month
        meta:
          title: 年月（YYYYMM）
      - name: pref_code
        meta:
          title: 都道府県コード（全国地方公共団体コード 2 桁）
      - name: pref_name
        meta:
          title: 都道府県名
      - name: extra_high_demand_mwh
        meta:
          title: 特別高圧の電力需要量（MWh）
      - name: extra_high_retailers
        meta:
          title: 特別高圧で当該月に需要実績のある小売電気事業者数
      - name: high_demand_mwh
        meta:
          title: 高圧の電力需要量（MWh）
      - name: high_retailers
        meta:
          title: 高圧で当該月に需要実績のある小売電気事業者数
      - name: low_demand_mwh
        meta:
          title: 低圧の電力需要量（MWh）
      - name: low_regulated_demand_mwh
        meta:
          title: 低圧のうち特定需要（経過措置料金）の電力需要量（MWh）
      - name: low_liberalized_demand_mwh
        meta:
          title: 低圧のうち自由料金の電力需要量（MWh）
      - name: low_retailers
        meta:
          title: 低圧で当該月に需要実績のある小売電気事業者数
      - name: total_demand_mwh
        meta:
          title: 全電圧計の電力需要量（MWh。特別高圧＋高圧＋低圧）
      - name: total_retailers
        meta:
          title: 全電圧計で当該月に需要実績のある小売電気事業者数（重複を除いた数）
      - name: published_as_of
        meta:
          title: 当該月の値の公表時点（古い月は原典に記載が無く NULL）

  - name: power_generation_by_prefecture
    description: |
      資源エネルギー庁 電力調査統計の統計表 2-(2)「都道府県別発電実績」（2016年度〜）。
      電気事業者の発電所が発電した電力量を都道府県×月の1レコードで収録する。
      発電所の種別は水力・火力・原子力・新エネルギー等・その他で、新エネルギー等は
      風力・太陽光・地熱・蓄電池の内訳を持つ。単位は MWh（原典の 1,000kWh と同値）。
      バイオマスと廃棄物は主燃料で見た再掲で、新エネルギー等の計にも合計にも含まれない。
      収録するのは47都道府県で、原典の合計行（全国計）は持たない。
      出典: 経済産業省 資源エネルギー庁 電力調査統計。
      https://www.enecho.meti.go.jp/statistics/electric_power/ep002/
    access: public
    config:
      meta:
        title: "都道府県別発電実績（2016年度〜・月次）"
        published: true
        source_url: "https://www.enecho.meti.go.jp/statistics/electric_power/ep002/"
        tags: ["経済産業省", "資源エネルギー庁", "電力調査統計", "発電", "電源構成", "再生可能エネルギー", "都道府県", "エネルギー"]
    columns:
