      - name: month
        meta:
          title: 月
      - name: year_month
        meta:
          title: 年月（YYYYMM）
      - name: pref_code
        meta:
          title: 都道府県コード（全国地方公共団体コード 2 桁）
      - name: pref_name
        meta:
          title: 都道府県名
      - name: hydro_mwh
        meta:
          title: 水力発電所の発電電力量（MWh）
      - name: thermal_mwh
        meta:
          title: 火力発電所の発電電力量（MWh）
      - name: nuclear_mwh
        meta:
          title: 原子力発電所の発電電力量（MWh）
      - name: wind_mwh
        meta:
          title: 新エネルギー等発電所のうち風力の発電電力量（MWh）
      - name: solar_mwh
        meta:
          title: 新エネルギー等発電所のうち太陽光の発電電力量（MWh）
      - name: geothermal_mwh
        meta:
          title: 新エネルギー等発電所のうち地熱の発電電力量（MWh）
      - name: biomass_mwh
        meta:
          title: バイオマスを主燃料とする発電電力量（MWh。再掲で計・合計には含まれない）
      - name: waste_mwh
        meta:
          title: 廃棄物を主燃料とする発電電力量（MWh。再掲で計・合計には含まれない）
      - name: storage_battery_mwh
        meta:
          title: 新エネルギー等発電所のうち蓄電池の放電電力量（MWh。2023年度以降のみで以前は NULL）
      - name: new_energy_mwh
        meta:
          title: 新エネルギー等発電所の計（MWh。風力＋太陽光＋地熱＋蓄電池）
      - name: other_mwh
        meta:
          title: その他の発電電力量（MWh）
      - name: total_mwh
        meta:
          title: 発電電力量の合計（MWh。水力＋火力＋原子力＋新エネルギー等の計＋その他）
      - name: published_as_of
        meta:
          title: 当該月の値の公表時点（古い月は原典に記載が無く NULL）

  - name: power_demand_by_municipality
    description: |
      資源エネルギー庁 電力調査統計の統計表 6-(1)「市町村別需要電力量」（2022年度〜2024年度）。
      小売電気事業者が供給した需要電力量を市区町村×月の1レコードで収録する。
      契約区分は「特別高圧／高圧」と「低圧」の2つで、都道府県別の統計表と違い特別高圧と高圧は
      分かれていない。需要量の単位は MWh（原典の 1,000kWh と同値）。
      収録するのは1,747市区町村で、政令指定都市は市単位・東京都特別区は区単位。
      原典に全国計・都道府県計の行は無く、市区町村コードの列も無い。
      市区町村名は都道府県の中でも一意ではない（北海道に泊村が2つある）。
      北方領土の6村は行はあるが値は全て0。負の値の行が4行ある（原典どおり）。
      合計は四捨五入の影響で内訳の和と一致しない月がある（原典の備考）。
      出典: 経済産業省 資源エネルギー庁 電力調査統計。
      https://www.enecho.meti.go.jp/statistics/electric_power/ep002/
    access: public
    config:
      meta:
        title: "市町村別需要電力量（2022〜2024年度・月次）"
        published: true
        source_url: "https://www.enecho.meti.go.jp/statistics/electric_power/ep002/"
        tags: ["経済産業省", "資源エネルギー庁", "電力調査統計", "電力需要", "市区町村", "エネルギー"]
    columns:
      - name: fiscal_year
        meta:
          title: 年度（4月始まり）
      - name: year
        meta:
          title: 年（暦年）
      - name: month
        meta:
          title: 月
      - name: year_month
        meta:
          title: 年月（YYYYMM）
      - name: pref_code
        meta:
          title: 都道府県コード（全国地方公共団体コード 2 桁）
      - name: pref_name
        meta:
          title: 都道府県名
      - name: municipality_name
        meta:
          title: 市区町村名（政令指定都市は市単位、東京都特別区は区単位）
      - name: extra_high_and_high_demand_mwh
        meta:
          title: 特別高圧／高圧の需要電力量（MWh。原典で特別高圧と高圧は分かれていない）
      - name: low_demand_mwh
        meta:
          title: 低圧の需要電力量（MWh）
      - name: total_demand_mwh
        meta:
          title: 需要電力量の合計（MWh。特別高圧／高圧＋低圧）
      - name: published_as_of
        meta:
          title: 当該月の値の公表時点

  - name: reverse_power_flow_by_municipality
    description: |
      資源エネルギー庁 電力調査統計の統計表 6-(2)「市町村別逆潮流量」（2022年度〜2024年度）。
      発電設備から系統へ流れた電力量（逆潮流量）を電源種別ごとに市区町村×月の1レコードで
      収録する。電源は水力・火力・原子力・風力・地熱・太陽光・バイオマス・蓄電池・その他で、
      蓄電池は2023年度に足された列のため2022年度は NULL。単位は MWh（原典の 1,000kWh と同値）。
      収録するのは1,747市区町村で、政令指定都市は市単位・東京都特別区は区単位。
      原典に全国計・都道府県計の行は無く、市区町村コードの列も無い。
      市区町村名は都道府県の中でも一意ではない（北海道に泊村が2つある）。
      北方領土の6村は行はあるが値は全て0。
      0 ではないが単位（1,000kWh）に満たない値は原典で「α」と記され、ここでは NULL になる
      （8,768セル。うち251は合計セルなので total_mwh も NULL）。
      合計は四捨五入の影響で電源別の和と一致しない月がある（原典の備考）。
      出典: 経済産業省 資源エネルギー庁 電力調査統計。
      https://www.enecho.meti.go.jp/statistics/electric_power/ep002/
    access: public
    config:
      meta:
        title: "市町村別逆潮流量（2022〜2024年度・月次）"
        published: true
        source_url: "https://www.enecho.meti.go.jp/statistics/electric_power/ep002/"
        tags: ["経済産業省", "資源エネルギー庁", "電力調査統計", "逆潮流", "太陽光発電", "再生可能エネルギー", "市区町村", "エネルギー"]
    columns:
