version: 2

models:
  - name: energy_balance_summary
    description: |
      資源エネルギー庁 総合エネルギー統計の時系列表（1990年度〜）。一次エネルギー国内供給・
      最終消費（エネルギー源別／部門別）・電源構成（発電量／投入量）・CO2排出量・
      エネルギー自給率の7表を、統計表×項目×系列×年度の1レコードに展開して収録する。
      series は公表どおりの系列ラベル（PJ・原油換算万kl・億kWh・Mt-CO2・kg-CO2/kWh の
      単位系列、および構成比・前年度比・％）で、value_type が quantity（実数）か
      ratio（比率）かを示す。比率は小数（0.25 = 25%）で、実数とは合算できない。
      合計・内訳・再掲が同じ item_name 列に並ぶため、大項目を単純に合計すると二重計上になる。
      出典: 経済産業省 資源エネルギー庁 総合エネルギー統計。
      https://www.enecho.meti.go.jp/statistics/total_energy/
    access: public
    columns:
      - name: table_no
      - name: table_name
      - name: item_name
      - name: item_level
      - name: series
      - name: value_type
      - name: fiscal_year
      - name: value
      - name: source_edition

  - name: power_demand_by_prefecture
    description: |
      資源エネルギー庁 電力調査統計の統計表 3-(2)「都道府県別電力需要実績」（2016年度〜）。
      小売電気事業者が供給した電力需要量を都道府県×月の1レコードで収録する。
      契約区分は特別高圧・高圧・低圧・全電圧計の4つで、低圧だけ特定需要（経過措置料金）と
      自由料金の内訳を持つ。需要量の単位は MWh（原典の 1,000kWh と同値）。
      小売電気事業者数は当該月に需要実績のあった事業者の数で、区分をまたいで足せない
      （全電圧計は重複を除いた数のため各区分の和より小さい）。
      収録するのは47都道府県で、原典の合計行（全国計）は持たない。
      出典: 経済産業省 資源エネルギー庁 電力調査統計。
      https://www.enecho.meti.go.jp/statistics/electric_power/ep002/
    access: public
    columns:
      - name: fiscal_year
      - name: year
      - name: month
      - name: year_month
      - name: pref_code
      - name: pref_name
      - name: extra_high_demand_mwh
      - name: extra_high_retailers
      - name: high_demand_mwh
      - name: high_retailers
      - name: low_demand_mwh
      - name: low_regulated_demand_mwh
      - name: low_liberalized_demand_mwh
      - name: low_retailers
      - name: total_demand_mwh
      - name: total_retailers
      - name: published_as_of

  - name: power_generation_by_prefecture
    description: |
      資源エネルギー庁 電力調査統計の統計表 2-(2)「都道府県別発電実績」（2016年度〜）。
      電気事業者の発電所が発電した電力量を都道府県×月の1レコードで収録する。
      発電所の種別は水力・火力・原子力・新エネルギー等・その他で、新エネルギー等は
      風力・太陽光・地熱・蓄電池の内訳を持つ。単位は MWh（原典の 1,000kWh と同値）。
      バイオマスと廃棄物は主燃料で見た再掲で、新エネルギー等の計にも合計にも含まれない。
      収録するのは47都道府県で、原典の合計行（全国計）は持たない。
      出典: 経済産業省 資源エネルギー庁 電力調査統計。
      https://www.enecho.meti.go.jp/statistics/electric_power/ep002/
    access: public
    columns:
      - name: fiscal_year
      - name: year
      - name: month
      - name: year_month
      - name: pref_code
      - name: pref_name
      - name: hydro_mwh
      - name: thermal_mwh
      - name: nuclear_mwh
      - name: wind_mwh
      - name: solar_mwh
      - name: geothermal_mwh
      - name: biomass_mwh
      - name: waste_mwh
      - name: storage_battery_mwh
      - name: new_energy_mwh
      - name: other_mwh
      - name: total_mwh
      - name: published_as_of

  - name: power_demand_by_operator
    description: |
      資源エネルギー庁 電力調査統計の統計表 3-(1)「電力需要実績」（2016年度〜）。
      小売電気事業者等が供給した電力需要量を事業者×月の1レコードで収録する。
      原典は1シートに事業者区分ごとの2つの表を並べており、operator_category がその区分。
      みなし小売電気事業者等（旧一般電気事業者）は特定需要（経過措置料金）・最終保障供給・
      離島供給・合計の欄を持ち、みなし小売電気事業者以外は自由料金の欄しか持たない
      （後者はこれらの列が NULL になる）。需要量の単位は MWh（原典の 1,000kWh と同値）。
      事業者名は月内でも一意ではなく、原典の合計行は持たない。
      出典: 経済産業省 資源エネルギー庁 電力調査統計。
      https://www.enecho.meti.go.jp/statistics/electric_power/ep002/
    access: public
    columns:
      - name: fiscal_year
      - name: year
      - name: month
      - name: year_month
      - name: operator_category
      - name: operator_category_ja
      - name: operator_name
      - name: is_retail
      - name: is_general_transmission_distribution
      - name: is_transmission
      - name: is_distribution
      - name: is_specified_transmission_distribution
      - name: is_generation
      - name: is_specified_wholesale
      - name: liberalized_demand_mwh
      - name: liberalized_extra_high_demand_mwh
      - name: liberalized_high_demand_mwh
      - name: liberalized_low_demand_mwh
      - name: liberalized_low_lighting_demand_mwh
      - name: liberalized_low_power_demand_mwh
      - name: regulated_demand_mwh
      - name: regulated_lighting_demand_mwh
      - name: regulated_power_demand_mwh
      - name: last_resort_supply_mwh
      - name: remote_island_supply_mwh
      - name: total_demand_mwh
      - name: published_as_of

  - name: power_generation_by_operator
    description: |
      資源エネルギー庁 電力調査統計の統計表 2-(1)「発電実績」（2016年度〜）。
      電気事業者ごとの発電電力量を事業者×月の1レコードで収録する。
      発電所の種別は水力・火力・原子力・新エネルギー等・その他で、水力は一般と揚水式、
      火力は石炭・ＬＮＧ・石油・ＬＰＧ・その他ガス・歴青質混合物・その他の燃料別、
      新エネルギー等は風力・太陽光・地熱・蓄電池の内訳を持つ。単位は MWh（原典の 1,000kWh と同値）。
      バイオマスと廃棄物は火力からの再掲で、どの計にも含まれない。
      is_ で始まる列は当該月にその事業区分に該当したかを表す。
      事業者名は原典の表記のままで名寄せしていない。
      収録するのは事業者の行で、原典の合計行（全事業者計）は持たない。
      出典: 経済産業省 資源エネルギー庁 電力調査統計。
      https://www.enecho.meti.go.jp/statistics/electric_power/ep002/
    access: public
    columns:
      - name: fiscal_year
      - name: year
      - name: month
      - name: year_month
      - name: operator_name
      - name: is_retail
      - name: is_general_transmission_distribution
      - name: is_transmission
      - name: is_distribution
      - name: is_specified_transmission_distribution
      - name: is_generation
      - name: is_specified_wholesale
      - name: hydro_conventional_mwh
      - name: hydro_pumped_storage_mwh
