      - name: wind_mwh
        meta:
          title: 風力の逆潮流量（MWh）
      - name: geothermal_mwh
        meta:
          title: 地熱の逆潮流量（MWh）
      - name: solar_mwh
        meta:
          title: 太陽光の逆潮流量（MWh）
      - name: biomass_mwh
        meta:
          title: バイオマスの逆潮流量（MWh）
      - name: storage_battery_mwh
        meta:
          title: 蓄電池の逆潮流量（MWh。2023年度以降のみで2022年度は NULL）
      - name: other_mwh
        meta:
          title: その他の電源の逆潮流量（MWh）
      - name: total_mwh
        meta:
          title: 逆潮流量の合計（MWh。電源別の和。四捨五入で一致しない月がある）
      - name: published_as_of
        meta:
          title: 当該月の値の公表時点
