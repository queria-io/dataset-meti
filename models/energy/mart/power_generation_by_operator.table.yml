schema: energy
name: power_generation_by_operator
title: 事業者別発電実績（2016年度〜・月次）
description: |-
  電力調査統計の、電気事業者ごとの月次の発電電力量（MWh）です。

  - バイオマスと廃棄物は火力からの再掲で、火力の計と合計に含まれ、新エネルギー等の計には含まれません。
  - 事業者名は原典の表記のままで、同じ会社が別の文字列になる月があります。
keywords:
  - 経済産業省
  - 資源エネルギー庁
  - 電力調査統計
  - 発電
  - 電源構成
  - 電気事業者
  - 再生可能エネルギー
  - エネルギー
published: true
themes: [energy_water]
sources:
