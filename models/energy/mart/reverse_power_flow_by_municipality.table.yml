schema: energy
name: reverse_power_flow_by_municipality
title: 市町村別逆潮流量（2022〜2024年度・月次）
description: |-
  電力調査統計の、市区町村別・電源別・月次の逆潮流量（MWh、2022〜2024年度）です。

  - 市区町村コードの列はありません。市区町村名は都道府県の中でも一意ではありません。
  - 原典で単位に満たない「α」のセルは NULL です。蓄電池の列は2022年度が NULL です。
keywords:
  - 経済産業省
  - 資源エネルギー庁
  - 電力調査統計
  - 逆潮流
  - 太陽光発電
  - 再生可能エネルギー
  - 市区町村
  - エネルギー
published: true
themes: [energy_water]
sources:
  - path: https://www.enecho.meti.go.jp/statistics/electric_power/ep002/
fields:
  - name: fiscal_year
    title: 年度（4月始まり）
  - name: year
    title: 年（暦年）
  - name: month
    title: 月
  - name: year_month
    title: 年月（YYYYMM）
  - name: pref_code
    title: 都道府県コード（全国地方公共団体コード 2 桁）
    semantic: { role: entity, name: prefecture }
  - name: pref_name
    title: 都道府県名
  - name: municipality_name
    title: 市区町村名（政令指定都市は市単位、東京都特別区は区単位）
  - name: hydro_mwh
    title: 水力の逆潮流量（MWh）
  - name: thermal_mwh
    title: 火力の逆潮流量（MWh）
  - name: nuclear_mwh
    title: 原子力の逆潮流量（MWh）
  - name: wind_mwh
    title: 風力の逆潮流量（MWh）
  - name: geothermal_mwh
    title: 地熱の逆潮流量（MWh）
  - name: solar_mwh
    title: 太陽光の逆潮流量（MWh）
  - name: biomass_mwh
    title: バイオマスの逆潮流量（MWh）
  - name: storage_battery_mwh
    title: 蓄電池の逆潮流量（MWh。2023年度以降のみで2022年度は NULL）
  - name: other_mwh
    title: その他の電源の逆潮流量（MWh）
  - name: total_mwh
    title: 逆潮流量の合計（MWh。電源別の和。四捨五入で一致しない月がある）
  - name: published_as_of
    title: 当該月の値の公表時点
