  - name: generation_mwh
    title: 発電電力量（MWh）
  - name: station_use_and_loss_mwh
    title: 所内及び損失電力量（MWh）
  - name: transmission_to_utilities_mwh
    title: 電気事業者への送電電力量（MWh）
  - name: transmission_to_specified_supply_mwh
    title: 特定供給の相手方への送電電力量（MWh）
  - name: transmission_to_other_operators_mwh
    title: その他事業者への送電電力量（MWh）
  - name: transmission_total_mwh
    title: 電気事業者等への送電電力量の合計（MWh）
  - name: transmission_via_exchange_mwh
    title: 送電電力量の合計のうち卸電力取引所を通じた取引（MWh。合計の内数）
  - name: self_consumption_mwh
    title: 自家消費電力量（MWh）
