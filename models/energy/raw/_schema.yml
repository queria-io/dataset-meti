version: 2

models:
  - name: raw_energy_balance
    description: 総合エネルギー統計 時系列表の生データ（統計表×項目×系列×年度）
    columns:
      - name: table_no
        description: 統計表番号（1〜7）
      - name: table_name
        description: 統計表名
      - name: item_name
        description: 項目名（エネルギー源・部門・電源等）
      - name: item_level
        description: 項目の階層（0=大項目、1=内訳）
      - name: series
        description: 系列ラベル（単位または構成比・前年度比）
      - name: fiscal_year
        description: 年度
      - name: value
        description: 値
      - name: source_edition
        description: 取り込んだ時系列表の版（例 2024年度確報）

  - name: raw_power_demand
    description: 電力調査統計 都道府県別電力需要実績の生データ（都道府県×月）
    columns:
      - name: year_month
        description: 年月（YYYYMM）
      - name: pref_code
        description: 都道府県コード（全国地方公共団体コード 2 桁）
      - name: pref_name
        description: 都道府県名
      - name: extra_high_demand_mwh
        description: 特別高圧の電力需要量（MWh）
      - name: extra_high_retailers
        description: 特別高圧で当該月に需要実績のある小売電気事業者数
      - name: high_demand_mwh
        description: 高圧の電力需要量（MWh）
      - name: high_retailers
        description: 高圧で当該月に需要実績のある小売電気事業者数
      - name: low_demand_mwh
        description: 低圧の電力需要量（MWh）
      - name: low_regulated_demand_mwh
        description: 低圧のうち特定需要（経過措置料金）の電力需要量（MWh）
      - name: low_liberalized_demand_mwh
        description: 低圧のうち自由料金の電力需要量（MWh）
      - name: low_retailers
        description: 低圧で当該月に需要実績のある小売電気事業者数
      - name: total_demand_mwh
        description: 全電圧計の電力需要量（MWh）
      - name: total_retailers
        description: 全電圧計で当該月に需要実績のある小売電気事業者数
      - name: published_as_of
        description: 当該月の値の公表時点

  - name: raw_power_generation
