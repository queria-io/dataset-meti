version: 2

models:
  - name: raw_energy_balance
    description: 総合エネルギー統計 時系列表の生データ（統計表×項目×系列×年度）
    columns:
      - name: table_no
        description: 統計表番号（1〜7）
      - name: table_name
        description: 統計表名
      - name: item_name
        description: 項目名（エネルギー源・部門・電源等）
      - name: item_level
        description: 項目の階層（0=大項目、1=内訳）
      - name: series
        description: 系列ラベル（単位または構成比・前年度比）
      - name: fiscal_year
        description: 年度
      - name: value
        description: 値
      - name: source_edition
        description: 取り込んだ時系列表の版（例 2024年度確報）

  - name: raw_power_demand
    description: 電力調査統計 都道府県別電力需要実績の生データ（都道府県×月）
    columns:
      - name: year_month
        description: 年月（YYYYMM）
      - name: pref_code
        description: 都道府県コード（全国地方公共団体コード 2 桁）
      - name: pref_name
        description: 都道府県名
      - name: extra_high_demand_mwh
        description: 特別高圧の電力需要量（MWh）
      - name: extra_high_retailers
        description: 特別高圧で当該月に需要実績のある小売電気事業者数
      - name: high_demand_mwh
        description: 高圧の電力需要量（MWh）
      - name: high_retailers
        description: 高圧で当該月に需要実績のある小売電気事業者数
      - name: low_demand_mwh
        description: 低圧の電力需要量（MWh）
      - name: low_regulated_demand_mwh
        description: 低圧のうち特定需要（経過措置料金）の電力需要量（MWh）
      - name: low_liberalized_demand_mwh
        description: 低圧のうち自由料金の電力需要量（MWh）
      - name: low_retailers
        description: 低圧で当該月に需要実績のある小売電気事業者数
      - name: total_demand_mwh
        description: 全電圧計の電力需要量（MWh）
      - name: total_retailers
        description: 全電圧計で当該月に需要実績のある小売電気事業者数
      - name: published_as_of
        description: 当該月の値の公表時点

  - name: raw_power_generation
    description: 電力調査統計 都道府県別発電実績の生データ（都道府県×月）
    columns:
      - name: year_month
        description: 年月（YYYYMM）
      - name: pref_code
        description: 都道府県コード（全国地方公共団体コード 2 桁）
      - name: pref_name
        description: 都道府県名
      - name: hydro_mwh
        description: 水力発電所の発電電力量（MWh）
      - name: thermal_mwh
        description: 火力発電所の発電電力量（MWh）
      - name: nuclear_mwh
        description: 原子力発電所の発電電力量（MWh）
      - name: wind_mwh
        description: 新エネルギー等発電所のうち風力の発電電力量（MWh）
      - name: solar_mwh
        description: 新エネルギー等発電所のうち太陽光の発電電力量（MWh）
      - name: geothermal_mwh
        description: 新エネルギー等発電所のうち地熱の発電電力量（MWh）
      - name: biomass_mwh
        description: バイオマスを主燃料とする発電電力量（MWh。再掲）
      - name: waste_mwh
        description: 廃棄物を主燃料とする発電電力量（MWh。再掲）
      - name: storage_battery_mwh
        description: 新エネルギー等発電所のうち蓄電池の放電電力量（MWh。2023年度以降のみ）
      - name: new_energy_mwh
        description: 新エネルギー等発電所の計（MWh。風力＋太陽光＋地熱＋蓄電池）
      - name: other_mwh
        description: その他の発電電力量（MWh）
      - name: total_mwh
        description: 発電電力量の合計（MWh）
      - name: published_as_of
        description: 当該月の値の公表時点

  - name: raw_power_demand_operator
    description: 電力調査統計 電力需要実績（事業者別）の生データ（事業者×月）
    columns:
      - name: year_month
        description: 年月（YYYYMM）
      - name: operator_category
        description: 事業者区分コード（deemed_retailer / other_retailer）
      - name: operator_category_ja
        description: 事業者区分名（みなし小売電気事業者等 / みなし小売電気事業者以外）
      - name: operator_name
        description: 事業者名（原典の表記どおり）
      - name: is_retail
        description: 小売電気事業者に該当するか
      - name: is_general_transmission_distribution
        description: 一般送配電事業者に該当するか
      - name: is_transmission
        description: 送電事業者に該当するか
      - name: is_distribution
        description: 配電事業者に該当するか（原典に欄がある年度のみ）
      - name: is_specified_transmission_distribution
        description: 特定送配電事業者に該当するか
      - name: is_generation
        description: 発電事業者に該当するか
      - name: is_specified_wholesale
        description: 特定卸供給事業者に該当するか（原典に欄がある年度のみ）
      - name: liberalized_demand_mwh
        description: その他需要（自由料金）の計（MWh）
      - name: liberalized_extra_high_demand_mwh
        description: 自由料金のうち特別高圧の電力需要量（MWh）
      - name: liberalized_high_demand_mwh
        description: 自由料金のうち高圧の電力需要量（MWh）
      - name: liberalized_low_demand_mwh
        description: 自由料金のうち低圧の計（MWh）
      - name: liberalized_low_lighting_demand_mwh
        description: 自由料金の低圧のうち電灯の電力需要量（MWh）
      - name: liberalized_low_power_demand_mwh
        description: 自由料金の低圧のうち電力の電力需要量（MWh）
      - name: regulated_demand_mwh
        description: 特定需要（経過措置料金）の計（MWh。みなし小売電気事業者等のみ）
      - name: regulated_lighting_demand_mwh
        description: 経過措置料金のうち電灯の電力需要量（MWh）
      - name: regulated_power_demand_mwh
        description: 経過措置料金のうち電力の電力需要量（MWh）
      - name: last_resort_supply_mwh
        description: 最終保障供給の電力需要量（MWh）
      - name: remote_island_supply_mwh
        description: 離島供給の電力需要量（MWh）
      - name: total_demand_mwh
        description: 合計（MWh。みなし小売電気事業者等のみ）
      - name: published_as_of
        description: 当該月の値の公表時点
