version: 2

models:
  - name: raw_energy_balance
    description: 総合エネルギー統計 時系列表の生データ（統計表×項目×系列×年度）
    columns:
      - name: table_no
        description: 統計表番号（1〜7）
      - name: table_name
        description: 統計表名
      - name: item_name
        description: 項目名（エネルギー源・部門・電源等）
      - name: item_level
        description: 項目の階層（0=大項目、1=内訳）
      - name: series
        description: 系列ラベル（単位または構成比・前年度比）
      - name: fiscal_year
        description: 年度
      - name: value
        description: 値
      - name: source_edition
        description: 取り込んだ時系列表の版（例 2024年度確報）

  - name: raw_power_demand
    description: 電力調査統計 都道府県別電力需要実績の生データ（都道府県×月）
    columns:
      - name: year_month
        description: 年月（YYYYMM）
      - name: pref_code
        description: 都道府県コード（全国地方公共団体コード 2 桁）
      - name: pref_name
        description: 都道府県名
      - name: extra_high_demand_mwh
        description: 特別高圧の電力需要量（MWh）
      - name: extra_high_retailers
        description: 特別高圧で当該月に需要実績のある小売電気事業者数
      - name: high_demand_mwh
        description: 高圧の電力需要量（MWh）
      - name: high_retailers
        description: 高圧で当該月に需要実績のある小売電気事業者数
      - name: low_demand_mwh
        description: 低圧の電力需要量（MWh）
      - name: low_regulated_demand_mwh
        description: 低圧のうち特定需要（経過措置料金）の電力需要量（MWh）
      - name: low_liberalized_demand_mwh
        description: 低圧のうち自由料金の電力需要量（MWh）
      - name: low_retailers
        description: 低圧で当該月に需要実績のある小売電気事業者数
      - name: total_demand_mwh
        description: 全電圧計の電力需要量（MWh）
      - name: total_retailers
        description: 全電圧計で当該月に需要実績のある小売電気事業者数
      - name: published_as_of
        description: 当該月の値の公表時点

  - name: raw_power_generation
    description: 電力調査統計 都道府県別発電実績の生データ（都道府県×月）
    columns:
      - name: year_month
        description: 年月（YYYYMM）
      - name: pref_code
        description: 都道府県コード（全国地方公共団体コード 2 桁）
      - name: pref_name
        description: 都道府県名
      - name: hydro_mwh
        description: 水力発電所の発電電力量（MWh）
      - name: thermal_mwh
        description: 火力発電所の発電電力量（MWh）
      - name: nuclear_mwh
        description: 原子力発電所の発電電力量（MWh）
      - name: wind_mwh
        description: 新エネルギー等発電所のうち風力の発電電力量（MWh）
      - name: solar_mwh
        description: 新エネルギー等発電所のうち太陽光の発電電力量（MWh）
      - name: geothermal_mwh
        description: 新エネルギー等発電所のうち地熱の発電電力量（MWh）
      - name: biomass_mwh
        description: バイオマスを主燃料とする発電電力量（MWh。再掲）
      - name: waste_mwh
        description: 廃棄物を主燃料とする発電電力量（MWh。再掲）
      - name: storage_battery_mwh
        description: 新エネルギー等発電所のうち蓄電池の放電電力量（MWh。2023年度以降のみ）
      - name: new_energy_mwh
        description: 新エネルギー等発電所の計（MWh。風力＋太陽光＋地熱＋蓄電池）
      - name: other_mwh
        description: その他の発電電力量（MWh）
      - name: total_mwh
        description: 発電電力量の合計（MWh）
      - name: published_as_of
        description: 当該月の値の公表時点

  - name: raw_power_demand_municipality
    description: 電力調査統計 市町村別需要電力量の生データ（市区町村×月）
    columns:
      - name: year_month
        description: 年月（YYYYMM）
      - name: pref_code
        description: 都道府県コード（全国地方公共団体コード 2 桁）
      - name: pref_name
        description: 都道府県名
      - name: municipality_name
        description: 市区町村名（政令指定都市は市単位、東京都特別区は区単位）
      - name: extra_high_and_high_demand_mwh
        description: 特別高圧／高圧の需要電力量（MWh）
      - name: low_demand_mwh
        description: 低圧の需要電力量（MWh）
      - name: total_demand_mwh
        description: 需要電力量の合計（MWh）
      - name: published_as_of
        description: 当該月の値の公表時点

  - name: raw_reverse_power_flow_municipality
    description: 電力調査統計 市町村別逆潮流量の生データ（市区町村×月）
    columns:
      - name: year_month
        description: 年月（YYYYMM）
      - name: pref_code
        description: 都道府県コード（全国地方公共団体コード 2 桁）
      - name: pref_name
        description: 都道府県名
      - name: municipality_name
        description: 市区町村名（政令指定都市は市単位、東京都特別区は区単位）
      - name: hydro_mwh
        description: 水力の逆潮流量（MWh）
      - name: thermal_mwh
        description: 火力の逆潮流量（MWh）
      - name: nuclear_mwh
        description: 原子力の逆潮流量（MWh）
      - name: wind_mwh
        description: 風力の逆潮流量（MWh）
      - name: geothermal_mwh
        description: 地熱の逆潮流量（MWh）
      - name: solar_mwh
        description: 太陽光の逆潮流量（MWh）
      - name: biomass_mwh
        description: バイオマスの逆潮流量（MWh）
      - name: storage_battery_mwh
        description: 蓄電池の逆潮流量（MWh。2023年度以降のみ）
      - name: other_mwh
        description: その他の電源の逆潮流量（MWh）
      - name: total_mwh
        description: 逆潮流量の合計（MWh）
      - name: published_as_of
        description: 当該月の値の公表時点
