schema: commerce
name: commercial_sales_by_industry
title: 業種別商業販売額（月次）
description: |-
  商業動態統計調査の業種別・月次の商業販売額（10億円、全国）です。

  - 商業計・卸売業計・小売業計と内訳の業種が同じ列に並びます。業種を絞らずに合計すると二重に数えます。
  - 調査の見直しをまたぐ接続処理はしていないため、1998年4月・2015年7月・2020年3月などで水準が不連続です。
keywords:
  - 経済産業省
  - 商業動態統計調査
  - 商業販売額
  - 卸売業
  - 小売業
  - 無店舗小売業
annotations: { queria: { themes: [commerce_services] } }
sources:
