schema: commerce
name: commercial_sales_by_industry
title: 業種別商業販売額（月次）
description: '経済産業省 商業動態統計調査の業種別商業販売額（月次）。卸売業・小売業の販売額を

  業種別に収録する。単位は10億円。1980年1月以降の全国の値で、地域別の内訳は無い。

  1行は「業種 × 月」。商業計・卸売業計・小売業計と、その内訳の業種、内訳を足し上げた

  参考系列が同じ列に並ぶので、業種を絞らずに合計すると二重計上になる。

  industry_order は原典の統計表での並び順で、合計とその内訳の対応を追うために使う。

  販売額は原典の公表値そのままで、調査の見直しをまたぐ接続処理はしていない。

  1998年4月・1999年4月・2015年7月・2020年3月・2025年1月に水準の不連続がある。

  出典: 経済産業省 商業動態統計調査。

  https://www.meti.go.jp/statistics/tyo/syoudou/'
