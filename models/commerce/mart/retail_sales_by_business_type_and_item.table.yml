schema: commerce
name: retail_sales_by_business_type_and_item
title: 業態別・商品別販売額（月次）
description: |-
  商業動態統計調査の、百貨店・スーパー・コンビニエンスストアなど業態別・商品分類別の月次販売額（全国）です。

  - 「百貨店・スーパー」は百貨店とスーパーの合計で、商品分類も合計と内訳が同じ列に並びます。絞らずに合計すると二重に数えます。
  - 収録の開始時点は業態で違います（百貨店・スーパー 1980年、コンビニ 1997年、その他 2014年）。
keywords:
