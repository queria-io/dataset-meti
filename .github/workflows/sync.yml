name: Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  schedule:
    - cron: "0 19 25 * *" # 毎月26日 04:00 JST
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@main
    with:
      dataset_name: meti
      # 共通の既定 90 分では足りない。成功ランの実測は最大 280 分。360 分はランナーの
      # 実行時間上限と同値で打ち切りとしては働かず、既定を外すためだけに渡している。
      # 止まったのか遅いのかを時間で見分けられるようにするにはビルドを分ける
      timeout_minutes: 360
    secrets: inherit
