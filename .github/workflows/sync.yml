name: Apply

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 19 25 * *" # 毎月26日 04:00 JST
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@4008bbec3bf8c5aad513b18c018b14d077e92920
    with:
      dataset_name: meti
      # 経済産業省のサイトは取得の間隔を 25 秒以上空けるので、計画・通知等の PDF だけで 1 時間ほどかかる
      timeout_minutes: 240
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
