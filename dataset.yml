# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
# Queria だけの項目（テーマ・カバー・AI 向けの説明・列の意味）は annotations.queria に書く。
name: meti
title: 経済産業省 第３次産業活動指数・商業動態統計
description: |-
  第３次産業活動指数と、商業動態統計の販売額を収録した統計です。
  出典は経済産業省の公表統計です。
  電力調査統計・総合エネルギー統計・石油製品価格調査は、資源エネルギー庁のデータセット enecho にあります。
keywords:
  - 経済産業省
  - 第3次産業活動指数
  - サービス産業
  - 景気
  - 商業動態統計調査
  - 商業販売額
  - 卸売業
  - 小売業
  - 百貨店
  - スーパー
  - コンビニエンスストア
  - ドラッグストア
  - ホームセンター
homepage: https://github.com/queria-io/dataset-meti
language: ja

licenses:
  - JP-PDL-1.0

sources:
  - title: 第３次産業活動指数（経済産業省 経済解析室）
    path: https://www.meti.go.jp/statistics/tyo/sanzi/
  - title: 商業動態統計調査（経済産業省）
    path: https://www.meti.go.jp/statistics/tyo/syoudou/

contributors:
  - title: 経済産業省
    path: https://www.meti.go.jp/
    roles: [rightsHolder]

temporal_coverage: { start: "1980-01", end: null }
spatial_coverage: [JP]
update_frequency: monthly

schemas:
  - name: main
    title: メイン
  - name: commerce
    title: 商業動態統計
annotations:
  queria:
    themes: [commerce_services]
    cover: 📈
    ai_context:
      instructions: |
        2つの統計が入っている。main.tertiary_industry_activity_index が第３次産業活動指数、
        commerce.commercial_sales_by_industry と
        commerce.retail_sales_by_business_type_and_item が商業動態統計調査の
        業種別商業販売額・業態別商品別販売額。粒度も単位も別なので混ぜない。
        電力・エネルギー需給・給油所の価格は資源エネルギー庁のデータセット enecho にある。

        main.tertiary_industry_activity_index はサービス産業の景気動向を業種別に見るのに使う。
        1行が「品目（業種）× 月 × 系列種別」で、
        2018年1月以降を月次で収録する（毎月のビルドで伸びる）。
        指数は2020年＝100 の相対値で、金額でも件数でもない。水準そのものより増減で見る。
        季節調整済指数（seasonally_adjusted）と原指数（original）が同じ表に入っているので、
        series_type で必ず絞る。混ぜると季節変動の有無が揃わず解釈できない。
        品目は「第３次産業総合」から日本標準産業分類の大分類・中分類・個別業種までの階層が
        同居している（252品目）。合計と内訳が同じ列に並ぶので、合算すると二重計上になる。
        総合の item_code は K1D000000I で、ウエイトは総合＝10000。
        鉱工業指数（第２次産業）は含まない。全国の値だけで、地域別の内訳は無い。

        commerce.commercial_sales_by_industry は卸売業・小売業の販売額そのもの（指数ではない）。
        1行が「業種 × 月」で、単位は10億円。1980年1月以降を月次で収録する（毎月のビルドで伸びる）。
        全国の値だけで、地域別の内訳は無い。
        商業計・卸売業計・小売業計と、その内訳の業種、内訳を足し上げた参考系列が同じ列に
        並ぶので、業種を絞らずに合計すると二重計上になる。industry_order は原典の統計表での
        並び順で、合計とその内訳の対応を追うのに使う。
        小売業の内訳には無店舗小売業（通信販売・ネット販売）が別掲されている。
        販売額は原典の公表値そのままで、調査の見直しをまたぐ接続処理はしていない。
        1998年4月・1999年4月・2015年7月・2020年3月・2025年1月に水準の不連続がある。

        commerce.retail_sales_by_business_type_and_item は業態ごとの商品別販売額。
        1行が「業態 × 商品分類 × 月」で、販売額は百万円、店舗数は店。
        business_type は 百貨店・スーパー / 百貨店 / スーパー / コンビニエンスストア /
        家電大型専門店 / ドラッグストア / ホームセンター の7つ。収録の開始時点は業態で違い、
        百貨店・スーパーが1980年1月、コンビニエンスストアが1997年4月、それ以外が2014年1月。
        「百貨店・スーパー」は百貨店とスーパーの合計なので、業態を絞らずに合計すると
        二重計上になる。商品分類も合計（「合計」「商品販売額」）と内訳が同じ列に並ぶので同様。
        item_name は業態ごとに体系が違い、同じ名前の商品分類が1つの業態に複数ある
        （家電大型専門店の「その他」）。商品分類を指すときは business_type と item_order の組で指す。
        sales_value_million_yen と establishments はどちらか一方だけが入る
        （店舗数の行では販売額が NULL）。
        販売額は原典の公表値そのままで、調査の見直しをまたぐ接続処理はしていない。
        不連続の時点は業態で違う（百貨店・スーパーは1991年7月・1994年7月・2010年7月・
        2013年7月・2015年7月・2020年3月、コンビニエンスストアは2012年1月・2017年1月・2021年3月、
        家電大型専門店は2018年1月・2020年3月、ドラッグストアは2015年1月・2017年1月・2018年1月・
        2019年1月）。リンク係数は原典の注シートにあり、このテーブルには適用していない。

      synonyms:
        [
          第3次産業活動指数,
          サービス産業,
          景気指数,
          経済解析室,
          商業動態統計,
          商業販売額,
          小売販売額,
          卸売販売額,
          百貨店売上,
          スーパー売上,
          コンビニ売上,
          ドラッグストア売上,
          ホームセンター売上,
          家電量販店,
          無店舗小売,
          商品別販売額,
          業態別販売額,
          店舗数,
        ]
      examples:
        - 第３次産業総合の指数の推移が見たい
        - 小売業の販売額の推移を業種別に見たい
        - コンビニの販売額が季節でどう動くか調べたい
        - 百貨店とスーパーの衣料品の販売額を比べたい
        - ドラッグストアの調剤医薬品と食品の構成比の変化を見たい
        - 無店舗小売業の販売額がいつから伸びたか知りたい
        - 家電大型専門店の1店舗あたり販売額を出したい
        - 業種別に前年同月比を出したい
        - 季節調整済指数で直近のサービス産業の動きを見たい
