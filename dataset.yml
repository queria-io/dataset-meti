  examples:
    - 第３次産業総合の指数の推移が見たい
    - 業種別に前年同月比を出したい
    - 季節調整済指数で直近のサービス産業の動きを見たい
    - 電源構成の推移を発電量ベースで見たい
    - 部門別のCO2排出量の変化を知りたい
    - エネルギー自給率の推移が見たい
    - 都道府県別の電力需要量を月次で比べたい
    - 低圧の自由料金への切り替わりがどこまで進んだか見たい
    - 猛暑の年に電力需要がどれだけ増えたか調べたい
    - 都道府県別に太陽光発電がどれだけ伸びたか見たい
    - 発電量と電力需要を都道府県ごとに突き合わせたい
    - 原子力発電の再稼働が県別の発電量にどう出ているか調べたい
    - 小売電気事業者ごとの電力需要量を月次で比べたい
    - 経過措置料金の需要が自由料金へどれだけ移ったか事業者別に見たい
    - 新電力の需要量が全体のどれくらいを占めるか調べたい
    - 事業者別に発電電力量の大きい順を見たい
    - 石炭とＬＮＧの発電量の推移を分けて見たい
    - 揚水式水力の発電量がどれだけあるか知りたい
    - 都道府県別に太陽光発電の設備容量がどれだけ増えたか見たい
    - 設備あたりの発電量（設備利用率）を電源別・県別に出したい
    - 発電所の数が多い都道府県を電源別に知りたい
    - 事業者別に発電設備の最大出力が大きい順を見たい
    - 事業者ごとに火力発電の燃料構成を設備容量で比べたい
    - 揚水式水力の設備をどの事業者が持っているか知りたい
    - 市区町村ごとの電力需要量を比べたい
    - 太陽光の逆潮流量が多い市区町村を知りたい
    - 低圧の需要が大きい市区町村を探したい
    - 火力発電の燃料が石炭からLNGへどう入れ替わったか見たい
    - LNGの月末貯蔵量が冬にどこまで減るか調べたい
    - 燃料種ごとの消費量を発熱量で熱量に換算して比べたい
    - 自家用発電の電力量が自家消費と系統への送電にどう分かれるか地域別に見たい
    - 自家用発電のコージェネレーションの発電量の推移を追いたい
    - 都道府県ごとに自家用発電の発電量と自家消費の割合を比べたい
    - 自家用の太陽光発電の設備容量が大きい都道府県を知りたい

