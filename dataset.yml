spec_version: "0.1"
name: meti
title: 経済産業省 活動指数・エネルギー統計
description: |-
  経済産業省 経済解析室が公表する第３次産業活動指数（2020年基準）と、
  資源エネルギー庁が公表する総合エネルギー統計の時系列表・電力調査統計。
  サービス産業の生産活動、国のエネルギー需給・電源構成・CO2排出量、
  都道府県別の電力需要・発電実績・発電所数と最大出力、
  事業者別の電力需要実績・発電実績・発電所数と最大出力、
  市区町村別の需要電力量と逆潮流量、火力発電所の燃料別の受入量・消費量、
  自家用発電所数と最大出力、自家用発電の発電電力量と自家消費電力量を収録する。
keywords:
  - 経済産業省
  - 第3次産業活動指数
  - サービス産業
  - 景気
  - 資源エネルギー庁
  - 総合エネルギー統計
  - エネルギー
  - 電力調査統計
  - 電力需要
  - 発電
  - 発電所
  - 設備容量
  - 逆潮流
  - 再生可能エネルギー
  - 市区町村
  - 火力発電
  - 燃料
  - 自家用発電
  - 自家消費
  - コージェネレーション
homepage: https://github.com/queria-io/dataset-meti
language: ja

licenses:
  - JP-PDL-1.0

sources:
  - title: 第３次産業活動指数（経済産業省 経済解析室）
    path: https://www.meti.go.jp/statistics/tyo/sanzi/
  - title: 総合エネルギー統計（経済産業省 資源エネルギー庁）
    path: https://www.enecho.meti.go.jp/statistics/total_energy/
  - title: 電力調査統計（経済産業省 資源エネルギー庁）
    path: https://www.enecho.meti.go.jp/statistics/electric_power/ep002/

contributors:
  - title: 経済産業省
    path: https://www.meti.go.jp/
    roles: [rightsHolder]

temporal_coverage: { start: "1990-04", end: null }
spatial_coverage: [JP]
update_frequency: monthly
cover: 📈

ai_context:
  instructions: |
    3つの統計が入っている。main.tertiary_industry_activity_index が第３次産業活動指数、
    energy.energy_balance_summary が総合エネルギー統計の時系列表、
    energy.power_demand_by_prefecture と energy.power_generation_by_prefecture と
    energy.power_plants_by_prefecture が
    電力調査統計の都道府県別電力需要実績・都道府県別発電実績・都道府県別発電所数、出力、
    energy.power_demand_by_operator と energy.power_generation_by_operator と
    energy.power_plants_by_operator が
    電力調査統計の事業者別電力需要実績・事業者別発電実績・事業者別発電所数、出力、
    energy.power_demand_by_municipality と energy.reverse_power_flow_by_municipality が
    電力調査統計の市町村別需要電力量・市町村別逆潮流量、
    energy.power_thermal_fuel_by_type が電力調査統計の火力発電燃料実績、
    energy.captive_power_plants_by_area が電力調査統計の自家用発電所数、出力、
    energy.captive_power_generation_by_area と
    energy.captive_power_generation_by_prefecture が電力調査統計の自家用発電実績。
    粒度も単位も別なので混ぜない。

    energy.power_demand_by_prefecture は1行が「都道府県 × 月」で、2016年度4月以降の月次。
    47都道府県のみで全国計の行は無い（必要なら都道府県を合算する）。需要量は MWh
    （原典の 1,000kWh と同値）。契約区分ごとに列が分かれ、total_demand_mwh は
    extra_high + high + low と一致するので、区分を足したうえに total も足すと二重計上になる。
    low_regulated_demand_mwh（特定需要＝経過措置料金）と low_liberalized_demand_mwh（自由料金）は
    low_demand_mwh の内訳。*_retailers は当該月に需要実績のあった小売電気事業者数で、
    需要量ではないうえ区分をまたいで足せない（total_retailers は重複を除いた数なので
    各区分の和より小さい）。pref_code は全国地方公共団体コードの2桁で、市区町村コードの
    上2桁と同じ体系。値は後から改定される（published_as_of がその月の公表時点）。

    energy.power_generation_by_prefecture も1行が「都道府県 × 月」で、2016年度4月以降の月次。
    電力需要実績と同じ粒度・同じ pref_code なので、都道府県ごとに発電（供給）と需要を
    year_month + pref_code で突き合わせられる。ただし発電量と需要量は別の統計表で、
    発電した都道府県と消費した都道府県は一致しない（送電がある）ので差を「余剰」とは呼べない。
    単位は MWh。total_mwh は hydro + thermal + nuclear + new_energy_mwh + other で、
    new_energy_mwh は wind + solar + geothermal + storage_battery の計。種別を足したうえに
    total_mwh も足すと二重計上になる。biomass_mwh と waste_mwh は主燃料で見た再掲で、
    new_energy_mwh にも total_mwh にも含まれない（発電量としては火力等に入っている）ので、
    再生可能エネルギーの合計を出すときに単純に足すと二重計上になる。
    storage_battery_mwh は2023年度4月に足された列で、それ以前は NULL。
    2026年4月分は原典の側で都道府県の行がずれており、佐賀県・鹿児島県の原子力の発電量が
    長崎県・沖縄県の行に入っている（他の120か月には無い）。原子力を県別に見るときは注意する。

    energy.power_demand_by_operator は1行が「事業者 × 月」で、2016年度4月以降の月次。
    同じ電力需要でも power_demand_by_prefecture とは表が違い、契約区分の切り方も違う
    （本表は自由料金と経過措置料金が先で、電圧はその内訳）ので列を対応づけて突き合わせられない。
    原典は1シートに事業者区分ごとの2つの表を並べており、operator_category がその区分。
    みなし小売電気事業者以外（other_retailer）の表には自由料金の欄しか無いため、
    regulated_*・last_resort_supply_mwh・remote_island_supply_mwh・total_demand_mwh は NULL になる。
    区分をまたいで需要量を足すときは total_demand_mwh ではなく liberalized_demand_mwh を使う
    （total_demand_mwh の合計だと other_retailer の分が落ちる）。単位は MWh。
    total_demand_mwh は liberalized + regulated + last_resort + remote_island、
    liberalized_demand_mwh は特別高圧＋高圧＋低圧計、低圧計は電灯＋電力なので、
    内訳を足したうえに計も足すと二重計上になる。operator_name は月内でも一意ではなく
    （同名の行が同じ月に並ぶ）、表記も年度で変わる。名寄せはしていないので事業者名で
    集計すると重複する。原典の「α」（0.5MWh 未満）と空欄は NULL。
    原典の側で計と内訳が合わない行があり、2019年4月の東京ガス(株)は低圧計が
    電灯＋電力より27,000 MWh 大きい（桁の取り違えとみられる）。

    energy.power_generation_by_operator は1行が「事業者 × 月」で、2016年度4月以降の月次。
    同じ発電実績を都道府県別ではなく電気事業者別に集計したもので、火力の燃料別内訳
    （石炭・ＬＮＧ・石油・ＬＰＧ・その他ガス・歴青質混合物・その他）と水力の揚水式内訳を持つ。
    地域の内訳は無く、事業者と都道府県を結ぶ鍵も原典に無いので都道府県別の表とは結合できない。
    operator_name は一意のキーにならない。同じ事業者名が同じ月に2行並ぶことが8事業者・のべ66件あり、
    値まで同じ2行のときは原典の合計行に1回しか入っていない（2022年8月の戸畑共同火力株式会社）。
    事業者名で合算すると原典の全国計より多く出る。表記も原典のままで名寄せしていないので
    （中部電力(株) が2019年10月から 中部電力株式会社）、時系列で追うには名寄せが要る。
    単位は MWh。total_mwh は hydro + thermal + nuclear + new_energy_mwh + other、
    hydro_mwh は一般＋揚水式、thermal_mwh は燃料別7列の和、new_energy_mwh は
    wind + solar + geothermal + storage_battery の計。内訳を足したうえに計も足すと二重計上になる。
    biomass_mwh と waste_mwh は火力からの再掲で、どの計にも含まれない。
    is_ で始まる列は当該月にその事業区分に該当したか。is_distribution と is_specified_wholesale は
    2022年度の区分新設以降のみ、storage_battery_mwh は2023年度以降のみで、それ以前は NULL。
    原典で「α」（0より大きく1,000kWh未満）のセルは NULL。原典の内訳と計が合わない行や
    負の値の行があり、原典どおり収録している。

    energy.power_plants_by_prefecture も1行が「都道府県 × 月」で、2019年度4月以降の月次。
    発電した電力量ではなく発電所の数と最大出力（設備容量）で、単位は kW。発電実績と同じ
    year_month + pref_code で1対1に結合できるので、設備あたりどれだけ発電したか（設備利用率）を
    県別・電源別に出せる。単位が kW と MWh で違う点に注意する。収録が2019年度からで、
    2016〜2018年度は原典が統計表 1「電気事業者の発電所数、出力」にまとめており都道府県別の
    内訳が無い（発電実績は2016年度からあるので期間が揃わない）。
    発電所数と最大出力は数え方が違う。一つの発電所に電源種別の異なる発電機がある場合、
    発電所数は最大出力が最大となる種別にだけ計上され、最大出力は種別ごとに計上される
    （原典の備考）ので、種別ごとの発電所数を足しても発電所の実数にはならない。
    total_plants / total_capacity_kw は 水力＋火力＋原子力＋新エネルギー等の計＋その他 で、
    new_energy_* は 風力＋太陽光＋地熱＋蓄電池 の計。種別を足したうえに計や total も足すと
    二重計上になる。biomass_* と waste_* は主燃料で見た火力発電所からの再掲で、
    new_energy_* にも total_* にも含まれない。storage_battery_* は2023年度4月に足された列で
    それ以前は NULL。原典の側で計・合計と内訳の和が合わない行があり（発電所数で28行、
    最大出力で1kW を超えるずれが42行）、原典どおり収録している。
    2026年4月分は発電実績と同じく原典の行がずれており、玄海（佐賀県）・川内（鹿児島県）の
    原子力発電所が長崎県・沖縄県の行に入っている。

    energy.power_plants_by_operator は同じ発電所数・最大出力を「事業者 × 月」で持つ表で、
    2019年度4月以降の月次（125,640行・85か月）。都道府県別に無い内訳として、水力の一般・揚水式、
    火力の燃料別7区分（石炭／ＬＮＧ／石油／ＬＰＧ／その他ガス／歴青質混合物／その他）、
    事業区分7つの is_ 列を持つ。単位は kW。事業者別発電実績（power_generation_by_operator）と
    同じ事業者名で対応づけられるが、operator_name は一意のキーにならない（同じ月に同じ名前が
    2行並ぶ組み合わせが30件ある）。事業者名は原典の表記のままで名寄せしておらず、法人格の
    書き方が年度で変わるため時系列で追うには名寄せが要る。原典が事業者名の欄に法人番号を
    書いている行が1行ある（2026年4月）。事業者と都道府県を結ぶ鍵は原典に
    無いので、都道府県別の表と結合することはできない（全国計は一致する）。
    合計・計の関係は都道府県別と同じで、種別を足したうえに計や total も足すと二重計上になる。
    biomass_* と waste_* は火力発電所の欄からの再掲（原典の備考3）で、火力の計と合計には
    含まれ、新エネルギー等の計には含まれない。原典がこの2列だけ〔49,000〕のように括弧付きの
    文字列で書いている月があり、括弧を外して数値にしている。
    storage_battery_* は2023年度4月、is_distribution と is_specified_wholesale は2022年度4月に
    足された列で、それ以前は NULL。原典の空欄も NULL で、0 とは区別している。

    energy.power_demand_by_municipality と energy.reverse_power_flow_by_municipality は
    1行が「市区町村 × 月」で、2022年度4月〜2025年3月の36か月。都道府県別の統計表が
    2016年度から毎月伸びるのに対し、市町村別の統計表は年1回まとめて公表され収録も3年度分しかない
    （2025年度以降は未公表）。年の範囲が違うので都道府県別の表と同じ期間で比べられない。
    収録は1,747市区町村で、政令指定都市は市単位・東京都特別区は区単位。全国計・都道府県計の行は無い。
    原典に市区町村コードの列が無いため municipality_name（市区町村名）で持っている。
    他のデータセットの市区町村コードと突き合わせるときは pref_name + municipality_name で照合する。
    ただし市区町村名は都道府県の中でも一意ではない。北海道に泊村が2つある（古宇郡泊村と
    北方領土の国後郡泊村）ため、year_month + pref_name + municipality_name はキーにならない。
    北方領土の6村（色丹村・泊村・留夜別村・留別村・紗那村・蘂取村）は行はあるが値は全て0。
    単位はどちらも MWh。power_demand_by_municipality の契約区分は「特別高圧／高圧」と「低圧」の
    2つだけで、都道府県別の表のように特別高圧と高圧に分かれていない（同じ区分では比べられない）。
    total_demand_mwh は2区分の和なので、区分を足したうえに total も足すと二重計上になる。
    reverse_power_flow_by_municipality は発電設備から系統へ流れた電力量を電源種別で持つ。
    発電実績（power_generation_by_prefecture）とは別の測定で、逆潮流量は発電量そのものではない。
    total_mwh は電源別の和で、storage_battery_mwh は2023年度に足された列のため2022年度は NULL。
    0 ではないが単位（1,000kWh）に満たない値は原典で「α」と記され、ここでは NULL になる
    （逆潮流量で 8,768 セル。うち 251 は合計セルなので total_mwh も NULL になる）。
    需要電力量には負の値の行が4行ある（原典の値がそのまま負）。
    どちらの表も合計と内訳の和は四捨五入の分だけずれることがある（原典の備考）。

    energy.power_thermal_fuel_by_type は1行が「燃料種 × 月」で、2016年度4月以降の月次。
    火力発電所が受け入れ・消費した燃料の実績で、全国の値だけ（都道府県別・発電所別は無い）。
    単位は燃料種ごとに違う（石炭・LNG などは t、重油・原油などは kl、ガス類は 10^3m3）ので、
    quantity_unit で確かめずに燃料種をまたいで数量を足してはいけない。熱量に換算するときは
    heat_value（単位は heat_value_unit）を掛ける。石炭とバイオマスだけ消費量が湿・乾の
    2段で公表され、乾ベースは consumption_dry_quantity に入る。発熱量がどちらの基準かは
    2023年度以前は原典から決まらず（湿・乾にまたがる結合セル）、2024年度以降は乾の行に置かれる。
    石炭とバイオマスの熱量換算はどちらを使うかで1割ほど変わる。合計や「計」の行は原典に無いので、
    燃料種を足しても二重計上にはならない。消費量は発電用のみで雑用を含まない。
    燃料種の区分は2024年度に変わった。バイオマスが木質バイオマスとその他バイオマスに分かれ、
    アンモニアと水素が加わり、その他が単位別に2つになった（2023年度以前24種・2024年度以降28種）。
    バイオマスの系列は2023年度と2024年度でつながらない。
    energy.power_generation_by_prefecture の thermal_mwh（火力の発電電力量）と同じ統計だが、
    こちらは投入した燃料の側で、粒度も単位も違う。

    energy.captive_power_plants_by_area は1行が「地域 × 時点」で、公表は月次ではなく
    9月末・3月末の年2回。2016年9月末〜2024年3月末の16時点・10地域で160行。
    year_month はその月末時点を表す。他の発電所の表と対象が違い、
    こちらは自家用発電所（自らの需要のために発電する設備）で、power_plants_by_prefecture と
    power_plants_by_operator の電気事業者の発電所とは重ならない。足し合わせても国内の発電設備の
    全量にはならない。報告の対象は発電設備の合計出力が1,000kW以上の自家用発電所で、
    単独では1,000kW未満の設備も報告に含まれる（原典の注1）。単位は kW。
    複数の発電方式を持つ発電所は方式ごとに1つの発電所として数えるため（原典の注2）、
    電気事業者の表と違って種別の発電所数を足すと合計に一致する。
    total_* は 水力＋火力の計＋原子力＋新エネルギー等の計＋その他 で、thermal_* は
    汽力＋ガスタービン＋内燃力、new_energy_* は 風力＋太陽光＋地熱＋蓄電池 の計。内訳を足した
    うえに計や total も足すと二重計上になる。thermal_cogeneration_* は火力の内数（再掲）で、
    火力の計にも合計にも含まれる。storage_battery_* は2023年度に足された列で以前は NULL。
    行は10地域で、原典の全国合計の行は持たない。
    地域より細かい内訳は原典に無く、都道府県別の表とは結合できない。
    2016年4月施行の改正電気事業法（第2弾改正）で発電事業に該当することになった発電所・設備は
    報告の対象外になった（原典の注3）。公表時点の欄が原典に無いため published_as_of は持たない。
    原典の側で新エネルギー等の計と内訳の和が合わない行が4つある（2016年9月の沖縄、
    2024年3月の近畿と沖縄）。原典どおり収録している。
    2024年度以降は原典が「自家用発電所等運転半期報集計結果」に統合され、この形式の統計表は
    公表されていない。2024年度以降の最大出力は captive_power_generation_by_prefecture が
    月次で持つ（発電所数は原典が年度計の欄にしか持たないため収録していない）。

    energy.captive_power_generation_by_area は1行が「地域 × 月 × 原動力」で、2017年4月以降の
    月次（84か月・10地域・23の原動力区分で19,320行）。captive_power_plants_by_area と同じ
    自家用発電所が対象で、あちらが発電所数と最大出力なのに対しこちらは発電した電力量。
    地域名は揃えてあるが、あちらは9月末・3月末の年2回なので突き合わせられるのは3月と9月だけ。
    単位はすべて MWh。generation_mwh は station_use_and_loss_mwh（所内及び損失）・
    transmission_total_mwh（電気事業者等への送電）・self_consumption_mwh（自家消費）に分かれ、
    transmission_total_mwh は送電先3列（電気事業者・特定供給の相手方・その他事業者）の和、
    transmission_via_exchange_mwh はそのうち卸電力取引所を通じた取引の内数。
    原動力は power_source_group と power_source_name の2列で、合計・内訳・再掲が同じ列に並ぶ。
    is_reference が true の行（火力のコージェネレーション、火力（燃料別）のすべて、
    新エネルギー等のバイオマスと廃棄物）と power_source_name が「計」の行を混ぜて足すと
    二重計上になる。火力（燃料別）は火力の原動力別を燃料別に置き換えた再掲、
    新エネルギー等のバイオマスと廃棄物は火力の原動力別からの再掲で、火力の計と合計には含まれ
    新エネルギー等の計には含まれない。地域は経済産業局の管轄で、都道府県別の内訳は原典に無い。
    蓄電池は2023年度に足された行で、発電電力量の欄は原典で空欄か0（所内損失・送電・自家消費だけが入る）。
    そのため2023年度は新エネルギー等の計と合計で発電電力量が内訳の和と合わない行がある。
    原典の食い違いをそのまま収録している。2021年度上期の近畿（2021年4〜9月）は2020年10月〜
    2021年3月の値がそのまま写されているので時系列から除く。2017年度下期は一部修正が地域の値にだけ
    反映され、全国合計の列と北陸の新エネルギー等の計が古いまま（北陸は内訳から足し直す）。
    2016年度は原典が別レイアウトで、値も発電電力量ではなく自家消費と特定供給の合計のため
    収録していない。2024年度以降は captive_power_generation_by_prefecture に続く。

    energy.captive_power_generation_by_prefecture は1行が「都道府県 × 月 × 原動力」で、
    2024年4月以降の月次（24か月・47都道府県・25の原動力区分で28,200行）。
    captive_power_generation_by_area の後継で、原典が2024年度から統計表 5-(1) と 5-(2) を
    「自家用発電所等実績」1つに統合し、同時に内訳が経済産業局の10地域から47都道府県へ
    細かくなった。列の意味と単位（電力量は MWh、最大出力は kW）はあちらと揃えてあるが、
    原典の単位は kWh なので原典の値と比べるときは1,000倍の差に注意する。
    あちらに無い capacity_kw（最大出力）を月次で持つ。発電所数は原典が年度計の欄にしか
    持たないため収録していない。
    区分の作りが変わっており、あちらの新エネルギー等の計はバイオマスと廃棄物の再掲を含まないが、
    こちらの新エネルギーの計はバイオマスの再掲を含む。そのため合計は
    水力＋火力の計＋原子力＋新エネルギーの計＋燃料電池等＋蓄電池からバイオマスの再掲を
    差し引いた値になる。廃棄物の行は新エネルギーに無く、火力（燃料別）だけが持つ。
    is_reference が true の行（火力のコージェネレーション、火力（燃料別）のすべて、
    新エネルギーのバイオマス）と power_source_name が「計」の行を混ぜて足すと二重計上になる。
    蓄電池の発電電力量の欄は充電電力量（原典の注6）で発電した電力量ではない。
    47都道府県のみで全国計のブロックは持たない（必要なら都道府県を合算する）。
    power_generation_by_prefecture は電気事業者の発電実績で対象が重ならないため、
    足し合わせても都道府県の発電量の全量にはならない。
    原典の食い違いをそのまま収録している。2024年度の岡山県は火力の燃料別の計が原動力別の計より
    小さい（年度計の発電電力量で467,530MWh）。2024年度の茨城県は太陽光の発電電力量が
    所内損失・送電・自家消費の和より小さい（年度計で15.6MWh）。2025年度の北海道の蓄電池は
    卸電力取引所を通じた取引が送電電力量の合計を上回る月が7つある（内数のはずが超える）。
    自家消費電力量が負の行が165、所内及び損失電力量が負の行が5ある。

    energy.energy_balance_summary は1行が「統計表 × 項目 × 系列 × 年度」で、1990年度以降の
    年度値。全国の値だけで地域別の内訳は無い。統計表は table_no 1〜7（一次エネルギー国内供給／
    最終消費(エネルギー源別)／最終消費(部門別)／電源構成(発電量)／電源構成(投入量)／CO2排出量／
    エネルギー自給率）で、まず table_no と series で絞る。
    series には単位系列（PJ・原油換算万kl・億kWh・Mt-CO2・kg-CO2/kWh）と比率系列
    （構成比・前年度比・％）が同居する。表1・2・3・5は PJ と 原油換算万kl が同じ値の別単位表現な
    ので両方足すと二重計上になる。比率は小数で、0.25 は 25% を意味する。
    合計と内訳が同じ item_name 列に並ぶ（item_level=0 が大項目、1 が内訳。「合計」も1行ある）。
    再掲項目も item_level=0 に混ざる。電源構成の「ゼロエミッション電源」は原子力・水力・太陽光・
    風力・地熱・バイオマスの再掲で、CO2排出量の「（参考）」始まりの項目も参考値。大項目を単純に
    合計すると二重に入る。「合計」の構成比は原典に行が無いので収録していない（定義上 1）。
    電源構成（table_no 4・5）は2010年度以降しか無く、2009年度以前は自家発電のバイオマスが
    別掲されていないため接続しても連続しない。

    main.tertiary_industry_activity_index はサービス産業の景気動向を業種別に見るのに使う。
    1行が「品目（業種）× 月 × 系列種別」で、
    2018年1月以降を月次で収録する（毎月のビルドで伸びる）。
    指数は2020年＝100 の相対値で、金額でも件数でもない。水準そのものより増減で見る。
    季節調整済指数（seasonally_adjusted）と原指数（original）が同じ表に入っているので、
    series_type で必ず絞る。混ぜると季節変動の有無が揃わず解釈できない。
    品目は「第３次産業総合」から日本標準産業分類の大分類・中分類・個別業種までの階層が
    同居している（252品目）。合計と内訳が同じ列に並ぶので、合算すると二重計上になる。
    総合の item_code は K1D000000I で、ウエイトは総合＝10000。
    鉱工業指数（第２次産業）は含まない。全国の値だけで、地域別の内訳は無い。
